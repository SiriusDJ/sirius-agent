[project]
name = "sirius-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SiriusDJ", email = "sirius.zhang997@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.55",
    "pyyaml>=6.0",
    "prompt-toolkit>=3.0",
    "rich>=13.9",
]

[project.scripts]
sirius-agent = "sirius_agent.__main__:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
